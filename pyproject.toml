[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stomatal-conductance-modeling"
version = "0.1.0"
description = "Modelling stomatal conductance under fluctuating light with LI-6800 measurements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.12,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "scikit-learn>=1.4,<2"]
lstm = ["torch>=2.2,<3"]

[project.scripts]
stomatal-analysis = "stomatal_conductance.cli:main"

[project.urls]
Repository = "https://github.com/benbenbeatit912002/stomatal-conductance-modeling"

[tool.setuptools.packages.find]
where = ["src"]
